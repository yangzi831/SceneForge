<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#08100f" />
  <title>SceneForge · 三角音乐节舞台</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #080e11; color: #eaf5f0; }
    #viewport { position: fixed; inset: 0; }
    #viewport canvas { display: block; width: 100%; height: 100%; }
    .panel { position: fixed; z-index: 5; top: 18px; left: 18px; width: min(340px, calc(100vw - 36px)); max-height: calc(100dvh - 36px); overflow: auto; padding: 18px; background: rgba(9,16,17,.88); border: 1px solid rgba(164,255,218,.2); border-radius: 16px; backdrop-filter: blur(18px); box-shadow: 0 15px 60px #0008; }
    .header { display:flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .eyebrow { color:#80d4b4; font-size:10px; letter-spacing:.16em; font-weight:700; }
    h1 { font-size:18px; margin:5px 0 3px; } p { color:#a7bbb2; font-size:12px; line-height:1.5; margin:5px 0; }
    .divider { margin: 14px 0; border: 0; border-top: 1px solid #ffffff20; }
    .row { display:flex; gap:7px; margin-top:8px; flex-wrap:wrap; }
    button, .file { cursor:pointer; border:1px solid #ffffff2c; background:#ffffff0e; color:#e9f6ef; border-radius:8px; padding:8px 10px; font:inherit; font-size:12px; flex:1; text-align:center; }
    button:hover, .file:hover { background:#ffffff20; } button.primary { background:#a9f4d5; color:#10241d; font-weight:700; }
    .file input { display:none; } .label { font-size:12px; font-weight:650; color:#dcebe3; margin:12px 0 5px; }
    .control { display:grid; grid-template-columns: 65px 1fr 44px; gap:8px; align-items:center; font-size:11px; color:#b9c9c0; margin:8px 0; }
    input[type=range] { width:100%; accent-color:#8aecc6; } output { text-align:right; font-variant-numeric:tabular-nums; }
    .toggles { display:flex; gap:16px; font-size:12px; color:#d0e2d8; margin:8px 0; } .toggles input { accent-color:#8aecc6; }
    .status { font-size:11px; color:#99c6b1; line-height:1.5; } .hint { font-size:11px; color:#90a69c; }
    .panel.collapsed { width:auto; padding:10px; } .panel.collapsed .content, .panel.collapsed .title { display:none; }
    a { color:#a9f4d5; } .warning { color:#ffcf8c; }
    @media(max-width: 600px) { .panel { max-height:45dvh; } }
  </style>
</head>
<body>
  <div id="viewport" role="img" aria-label="三维舞台预览"></div>
  <section class="panel" id="panel">
    <div class="header"><div class="title"><span class="eyebrow">SCENEFORGE / THREE.JS</span><h1>音乐节舞台 · 画质预览</h1></div><button type="button" id="collapse" style="flex:none">收起</button></div>
    <div class="content">
      <p>一组画面调整同时作用于主屏、三角屏、顶屏、环屏、球屏和前纱幕。</p>
      <div class="row"><button type="button" class="primary" id="share">选择窗口 / 屏幕</button><label class="file">选择视频<input id="file" type="file" accept="video/*" /></label><button type="button" id="stop">停止</button></div>
      <p class="status" id="status">默认示意画面。拖动旋转视角，滚轮缩放。</p>
      <hr class="divider" />
      <div class="label">统一画面 / UV 对齐</div>
      <div class="control"><label for="scaleX">水平范围</label><input id="scaleX" type="range" min="0.25" max="2" step="0.01" value="1"><output id="scaleXOut">1.00</output></div>
      <div class="control"><label for="scaleY">垂直范围</label><input id="scaleY" type="range" min="0.25" max="2" step="0.01" value="1"><output id="scaleYOut">1.00</output></div>
      <div class="control"><label for="offsetX">左右偏移</label><input id="offsetX" type="range" min="-1" max="1" step="0.01" value="0"><output id="offsetXOut">0.00</output></div>
      <div class="control"><label for="offsetY">上下偏移</label><input id="offsetY" type="range" min="-1" max="1" step="0.01" value="0"><output id="offsetYOut">0.00</output></div>
      <div class="row"><button type="button" id="resetUV">重置画面</button></div>
      <p class="hint">范围越小画面越放大；偏移以纹理为单位，边缘外使用边缘颜色。设置会保存在此浏览器。</p>
      <hr class="divider" />
      <div class="label">前方透明屏</div>
      <div class="toggles"><label><input type="checkbox" id="scrimVisible" checked> 显示前纱幕</label></div>
      <div class="control"><label for="scrimOpacity">画面强度</label><input id="scrimOpacity" type="range" min="0" max="1" step="0.01" value="0.42"><output id="scrimOpacityOut">0.42</output></div>
      <div class="control"><label for="scrimKey">消除暗部</label><input id="scrimKey" type="range" min="0" max="0.9" step="0.01" value="0.12"><output id="scrimKeyOut">0.12</output></div>
      <p class="hint">人物在透明屏后方。黑底视觉较容易透出人物；亮色画面仍会叠在人物前面。</p>
      <hr class="divider" />
      <div class="label">画面效果</div><div class="toggles"><label><input type="checkbox" id="ssr" checked> 地面反射</label><label><input type="checkbox" id="bloom" checked> Bloom 柔光</label></div>
      <div class="control"><label for="bloomStrength">柔光强度</label><input id="bloomStrength" type="range" min="0" max="1.6" step="0.05" value="0.55"><output id="bloomStrengthOut">0.55</output></div>
      <div class="row"><button type="button" id="front">观众正面</button><button type="button" id="wide">斜侧全景</button><button type="button" id="top">俯视</button><button type="button" id="orbit">环屏特写</button><button type="button" id="performer">人物视角</button></div>
      <p class="hint">此版本支持本机屏幕或视频预览。跨设备房间和 WebXR 使用 <a href="../entropy-stage/">原版舞台</a>。</p>
    </div>
  </section>
  <script type="module" src="./main.js"></script>
</body>
</html>
